[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mm-sim"
version = "0.1.0"
description = "Market-making research lab: an event-driven limit order book simulator, zero-intelligence order flow and inventory-aware quoting bots."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Louis Belot" }]
keywords = ["market-making", "order-book", "avellaneda-stoikov", "market-microstructure", "simulation"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/Lemypoo/mm-sim"

[tool.hatch.build.targets.wheel]
packages = ["src/mmsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
